[project]
name = "diffusionbot"
version = "0.1.0"
description = "Agent autonome de diffusion SEO — backlinks intelligents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "anthropic>=0.40",
    "playwright>=1.42",
    "httpx>=0.27",
    "cryptography>=42.0",
    "python-dotenv>=1.0",
    "click>=8.1",
    "numpy>=1.26",
    "jinja2>=3.1",
    "google-api-python-client>=2.120",
    "google-auth>=2.28",
    "google-auth-oauthlib>=1.2",
    "google-analytics-data>=0.18",
]

[tool.setuptools.packages.find]
include = ["config*", "db*", "api*", "adapters*", "services*", "workers*", "cron*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
]

[project.scripts]
diffusionbot = "cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
